<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #login {
            background: #12121a;
            padding: 50px 40px;
            border-radius: 16px;
            border: 1px solid #2a2a3a;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            width: 340px;
        }
        #login input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a26;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
            margin-bottom: 12px;
        }
        #login input:focus {
            border-color: #6c6cff;
            box-shadow: 0 0 20px rgba(108,108,255,0.08);
        }
        #login input::placeholder {
            color: #555566;
            font-weight: 300;
            letter-spacing: 1px;
        }
        #login button {
            width: 100%;
            padding: 14px;
            background: #6c6cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            text-transform: lowercase;
        }
        #login button:hover {
            background: #7a7aff;
        }
        #login button:active {
            transform: scale(0.97);
        }
        #error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 14px;
            display: none;
            letter-spacing: 0.5px;
        }
        #iframe-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #0a0a0f;
        }
        #iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        .logout-btn {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 9999;
            background: rgba(26,26,38,0.9);
            color: #8888aa;
            border: 1px solid #2a2a3e;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            transition: background 0.3s, color 0.3s;
            display: none;
            backdrop-filter: blur(10px);
        }
        .logout-btn:hover {
            background: #2a2a3e;
            color: #e0e0e0;
        }
        @media (max-width: 480px) {
            #login {
                width: 90%;
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- login screen -->
    <div id="login">
        <input type="password" id="passwordInput" placeholder="password" autofocus>
        <button onclick="checkPassword()">unlock</button>
        <div id="error">access denied</div>
    </div>

    <!-- mirror content -->
    <div id="iframe-container">
        <iframe src="https://s3.amazonaws.com/cleverlearning/index.html"></iframe>
        <button class="logout-btn" onclick="logout()">exit</button>
    </div>

    <script>
        const correctPassword = "fall";

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('error');
            const password = input.value.trim();

            if (password === correctPassword) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('iframe-container').style.display = 'block';
                document.querySelector('.logout-btn').style.display = 'block';
                error.style.display = 'none';
            } else {
                error.style.display = 'block';
                input.value = '';
                input.focus();
                input.style.borderColor = '#ff6b6b';
                setTimeout(() => { input.style.borderColor = '#2a2a3e'; }, 800);
            }
        }

        function logout() {
            document.getElementById('login').style.display = 'flex';
            document.getElementById('iframe-container').style.display = 'none';
            document.querySelector('.logout-btn').style.display = 'none';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
