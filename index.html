<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #login {
            background: #12121a;
            padding: 50px 40px;
            border-radius: 16px;
            border: 1px solid #2a2a3a;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            width: 340px;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 10;
        }
        #login.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        #login input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a26;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
            margin-bottom: 12px;
        }
        #login input:focus {
            border-color: #6c6cff;
            box-shadow: 0 0 20px rgba(108,108,255,0.08);
        }
        #login input::placeholder {
            color: #555566;
            font-weight: 300;
            letter-spacing: 1px;
        }
        #login button {
            width: 100%;
            padding: 14px;
            background: #6c6cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            text-transform: lowercase;
        }
        #login button:hover {
            background: #7a7aff;
        }
        #login button:active {
            transform: scale(0.97);
        }
        #error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 14px;
            display: none;
            letter-spacing: 0.5px;
        }

        /* Fall Productions splash screen */
        #splash {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0f;
            z-index: 20;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        #splash.show {
            opacity: 1;
        }
        #splash.fade-out {
            opacity: 0;
        }
        #splash .text {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 12px;
            color: #e0e0e0;
            text-transform: lowercase;
        }
        #splash .text span {
            color: #6c6cff;
            font-weight: 400;
        }
        @media (max-width: 480px) {
            #splash .text {
                font-size: 28px;
                letter-spacing: 8px;
            }
            #login {
                width: 90%;
                padding: 40px 24px;
            }
        }

        #iframe-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #0a0a0f;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 5;
        }
        #iframe-container.fade-in {
            opacity: 1;
        }
        #iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        .logout-btn {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 9999;
            background: rgba(26,26,38,0.9);
            color: #8888aa;
            border: 1px solid #2a2a3e;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            transition: background 0.3s, color 0.3s, opacity 0.8s ease;
            display: none;
            backdrop-filter: blur(10px);
            opacity: 0;
        }
        .logout-btn.show {
            opacity: 1;
        }
        .logout-btn:hover {
            background: #2a2a3e;
            color: #e0e0e0;
        }
    </style>
</head>
<body>

    <!-- login screen -->
    <div id="login">
        <input type="password" id="passwordInput" placeholder="password" autofocus>
        <button onclick="checkPassword()">unlock</button>
        <div id="error">access denied</div>
    </div>

    <!-- splash screen -->
    <div id="splash">
        <div class="text">fall <span>productions</span></div>
    </div>

    <!-- mirror content -->
    <div id="iframe-container">
        <iframe src="https://s3.amazonaws.com/cleverlearning/index.html"></iframe>
        <button class="logout-btn" onclick="logout()">exit</button>
    </div>

    <script>
        const correctPassword = "fall";

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('error');
            const password = input.value.trim();

            if (password === correctPassword) {
                // Fade out login
                document.getElementById('login').classList.add('fade-out');
                error.style.display = 'none';

                // Show splash screen with fade in
                const splash = document.getElementById('splash');
                splash.style.display = 'flex';
                
                // Trigger fade in after a tiny delay
                setTimeout(() => {
                    splash.classList.add('show');
                }, 50);

                // After 1.5 seconds, fade out splash and show mirror
                setTimeout(() => {
                    splash.classList.add('fade-out');
                    
                    // Show mirror after splash fades out
                    setTimeout(() => {
                        splash.style.display = 'none';
                        splash.classList.remove('show', 'fade-out');
                        
                        const container = document.getElementById('iframe-container');
                        container.style.display = 'block';
                        setTimeout(() => {
                            container.classList.add('fade-in');
                        }, 50);

                        const logoutBtn = document.querySelector('.logout-btn');
                        logoutBtn.style.display = 'block';
                        setTimeout(() => {
                            logoutBtn.classList.add('show');
                        }, 300);
                    }, 1000);
                }, 1500);

            } else {
                error.style.display = 'block';
                input.value = '';
                input.focus();
                input.style.borderColor = '#ff6b6b';
                setTimeout(() => { input.style.borderColor = '#2a2a3e'; }, 800);
            }
        }

        function logout() {
            const container = document.getElementById('iframe-container');
            container.classList.remove('fade-in');

            const logoutBtn = document.querySelector('.logout-btn');
            logoutBtn.classList.remove('show');

            setTimeout(() => {
                container.style.display = 'none';
                logoutBtn.style.display = 'none';
                document.getElementById('login').classList.remove('fade-out');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }, 500);
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
